<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harshest Nights Stat Calculator</title>
<style>
  :root {
    --bg: #14121a;
    --panel: #1e1b27;
    --text: #ece8f4;
    --muted: #a49fb5;
    --accent: #b9a2f2;
    --border: #3a3550;
    --error: #ff9b9b;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f2f9;
      --panel: #ffffff;
      --text: #211d2e;
      --muted: #5f5a70;
      --accent: #5b3fb0;
      --border: #cfc9de;
      --error: #b3261e;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.5;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 16px;
  }
  label { display: block; margin: 12px 0 4px; }
  select, input[type="number"] {
    width: 100%;
    padding: 8px;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  button {
    margin-top: 16px;
    padding: 9px 18px;
    font: inherit;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .message { margin: 12px 0 0; min-height: 1.5em; }
  .error { color: var(--error); }
  pre {
    margin: 0;
    white-space: pre-wrap;
    font-family: inherit;
  }
  ul { margin: 0; padding-left: 20px; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1>Harshest Nights Stat Calculator</h1>
  <p class="sub">Work out your cat’s starting stats from their clan and size.</p>

  <!-- STEP 1: clan and size questions -->
  <section id="setup">
    <h2>Your cat</h2>

    <label for="halfclan">Is your cat a halfclan?</label>
    <select id="halfclan">
      <option value="N">No</option>
      <option value="Y">Yes</option>
    </select>

    <!-- Shown when halfclan = No -->
    <div id="singleClanBox">
      <label for="clan">What is your cat’s clan?</label>
      <select id="clan">
        <option value="Lynxclan">Lynxclan</option>
        <option value="Minkclan">Minkclan</option>
        <option value="Wolfclan">Wolfclan</option>
        <option value="Sealclan">Sealclan</option>
        <option value="N/A">N/A</option>
      </select>
    </div>

    <!-- Shown when halfclan = Yes -->
    <div id="halfClanBox" class="hidden">
      <label for="clan1">What is your cat’s first clan?</label>
      <select id="clan1">
        <option value="Lynxclan">Lynxclan</option>
        <option value="Minkclan">Minkclan</option>
        <option value="Wolfclan">Wolfclan</option>
        <option value="Sealclan">Sealclan</option>
      </select>

      <label for="clan2">What is your cat’s second clan?</label>
      <select id="clan2">
        <option value="Lynxclan">Lynxclan</option>
        <option value="Minkclan" selected>Minkclan</option>
        <option value="Wolfclan">Wolfclan</option>
        <option value="Sealclan">Sealclan</option>
      </select>
    </div>

    <label for="size">What is your cat’s size (1-10)?</label>
    <select id="size"></select>

    <button id="calcBtn" type="button">Calculate stats</button>
    <p id="setupError" class="message error"></p>
  </section>

  <!-- STEP 2: results -->
  <section id="results" class="hidden">
    <h2>Stats</h2>
    <pre id="statsOutput"></pre>
  </section>

  <!-- STEP 3: moving points (sizes above 3 only) -->
  <section id="moveSection" class="hidden">
    <h2>Move points between stats</h2>

    <label for="takeFrom">Take points from which stat?</label>
    <select id="takeFrom"></select>

    <label for="giveTo">Give them to which stat?</label>
    <select id="giveTo"></select>

    <label for="amount">How many points?</label>
    <input id="amount" type="number" value="1" step="1">

    <button id="moveBtn" type="button">Move points</button>
    <p id="moveError" class="message error"></p>
  </section>

  <!-- STEP 4: log -->
  <section id="logSection" class="hidden">
    <h2>Stat log</h2>
    <div id="logOutput"></div>

    <h2 style="margin-top:16px;">Starting and final stats</h2>
    <pre id="summaryOutput"></pre>

    <h2 style="margin-top:16px;">Net changes</h2>
    <pre id="netOutput"></pre>
  </section>
</main>

<script>
  // ---------- DATA (same as the Python dictionaries) ----------

  // Which stat each clan boosts
  const clanStat = {
    "Lynxclan": "vigor",
    "Minkclan": "vitality",
    "Wolfclan": "dexterity",
    "Sealclan": "swiftness"
  };

  // Stat changes for each size (sizes 1-3 are handled separately)
  const sizeChanges = {
    4: { vigor: -1, swiftness: 1 },
    5: { vigor: 1, swiftness: 1 },
    6: { vigor: 1, vitality: 1 },
    7: { vigor: 1, swiftness: -1 },
    8: { vigor: 2, swiftness: -2 },
    9: { vigor: 3, swiftness: -4 },
    10: { vigor: 4, swiftness: -5, vitality: -2 }
  };

  const statNames = ["vigor", "vitality", "swiftness", "dexterity"];

  // These change as the calculator runs
  let stats = {};
  let startingStats = {};
  let taken = {};
  let statLog = [];
  let size = 0;

  // ---------- PAGE SETUP ----------

  const $ = (id) => document.getElementById(id);

  // Fill the size dropdown with 1-10
  for (let i = 1; i <= 10; i++) {
    const option = document.createElement("option");
    option.value = i;
    option.textContent = i;
    if (i === 5) option.selected = true;
    $("size").appendChild(option);
  }

  // Fill the "take from" and "give to" dropdowns with the stat names
  for (const name of statNames) {
    for (const id of ["takeFrom", "giveTo"]) {
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      $(id).appendChild(option);
    }
  }
  $("giveTo").selectedIndex = 1;

  // Show the right clan question(s) for halfclan yes/no
  $("halfclan").addEventListener("change", () => {
    const isHalf = $("halfclan").value === "Y";
    $("singleClanBox").classList.toggle("hidden", isHalf);
    $("halfClanBox").classList.toggle("hidden", !isHalf);
  });

  // ---------- CALCULATE STATS ----------

  $("calcBtn").addEventListener("click", () => {
    $("setupError").textContent = "";

    // Base stats
    stats = { vigor: 5, vitality: 5, swiftness: 5, dexterity: 5 };

    // Clan bonuses
    if ($("halfclan").value === "Y") {
      const clan1 = $("clan1").value;
      const clan2 = $("clan2").value;

      if (clan1 === clan2) {
        $("setupError").textContent = "A halfclan cat needs two different clans. Please pick again.";
        return;
      }
      stats[clanStat[clan1]] += 1;
      stats[clanStat[clan2]] += 1;
    } else {
      const clan = $("clan").value;

      if (clan === "N/A") {
        // Rogues get two random points
        stats[randomChoice(statNames)] += 1;
        stats[randomChoice(statNames)] += 1;
      } else {
        stats[clanStat[clan]] += 2;
      }
    }

    // Size changes
    size = parseInt($("size").value, 10);

    if (size <= 3) {
      for (const stat of statNames) {
        stats[stat] = 2;
      }
    } else {
      for (const [stat, change] of Object.entries(sizeChanges[size])) {
        stats[stat] += change;
      }
    }

    // Reset the log and the "points taken" counters
    statLog = [];
    startingStats = { ...stats };
    taken = {};
    for (const stat of statNames) taken[stat] = 0;

    // Show the right sections
    $("moveError").textContent = "";
    $("results").classList.remove("hidden");
    $("moveSection").classList.toggle("hidden", size <= 3);
    $("logSection").classList.remove("hidden");
    render();
  });

  // Pick one random item from a list (like Python's random.choice)
  function randomChoice(list) {
    return list[Math.floor(Math.random() * list.length)];
  }

  // ---------- MOVE POINTS ----------

  $("moveBtn").addEventListener("click", () => {
    const takeFrom = $("takeFrom").value;
    const giveTo = $("giveTo").value;
    const amount = parseInt($("amount").value, 10);
    const error = $("moveError");
    error.textContent = "";

    // Same rules, in the same order, as the Python version
    if (Number.isNaN(amount)) {
      error.textContent = "Please type a whole number.";
    } else if (takeFrom === giveTo) {
      error.textContent = "Please pick two different stats.";
    } else if (amount < 1) {
      error.textContent = "The amount must be at least 1.";
    } else if (taken[takeFrom] + amount > 4) {
      error.textContent = "You can only take up to 4 points from each stat.";
    } else if (stats[takeFrom] - amount < 0) {
      error.textContent = "A stat can’t go below 0.";
    } else {
      stats[takeFrom] -= amount;
      stats[giveTo] += amount;
      taken[takeFrom] += amount;
      statLog.push("-" + amount + " " + takeFrom + ", +" + amount + " " + giveTo);
      render();
    }
  });

  // ---------- SHOW EVERYTHING ----------

  function formatStats(obj) {
    return statNames.map((s) => s + ": " + obj[s]).join("\n");
  }

  function render() {
    $("statsOutput").textContent = formatStats(stats);

    // Stat log
    const logBox = $("logOutput");
    logBox.innerHTML = "";
    if (statLog.length === 0) {
      logBox.textContent = "No points were moved.";
    } else {
      const list = document.createElement("ul");
      for (const entry of statLog) {
        const item = document.createElement("li");
        item.textContent = entry;
        list.appendChild(item);
      }
      logBox.appendChild(list);
    }

    // Starting and final stats
    $("summaryOutput").textContent =
      "STARTING STATS\n" + formatStats(startingStats) +
      "\n\nFINAL STATS\n" + formatStats(stats);

    // Net change for each stat
    $("netOutput").textContent = statNames.map((s) => {
      const change = stats[s] - startingStats[s];
      const sign = change >= 0 ? "+" : "";
      return s + ": " + startingStats[s] + " -> " + stats[s] + " (" + sign + change + ")";
    }).join("\n");
  }
</script>
</body>
</html>
